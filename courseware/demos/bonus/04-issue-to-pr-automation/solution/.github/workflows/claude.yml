# Runs Claude Code when someone mentions @claude in an issue, an issue or PR comment, or a PR review comment.
# Set up with /install-github-app in Claude Code, or add the ANTHROPIC_API_KEY secret and the Claude GitHub App
# by hand. (With a Claude subscription, use claude_code_oauth_token and the CLAUDE_CODE_OAUTH_TOKEN secret.)
name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run at a time per issue or PR, so a burst of comments doesn't start several sessions.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Skip runner start-up for events that don't mention @claude. The action checks the trigger phrase too.
    if: >-
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Let Claude run the verify loop without asking, and cap how long one request can run.
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash(dotnet restore *),Bash(dotnet build *),Bash(dotnet test *),Bash(dotnet format *)"
